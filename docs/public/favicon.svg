<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WorkBuddyHelper">
  <defs>
    <linearGradient id="wb-favicon-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="wb-favicon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- dark rounded square background -->
  <rect width="64" height="64" rx="14" fill="#070b16"/>

  <!-- subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#wb-favicon-grad)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- W monogram -->
  <path
    fill="none"
    stroke="url(#wb-favicon-grad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#wb-favicon-glow)"
    d="M16 20 L24 44 L32 28 L40 44 L48 20"
  />
</svg>
